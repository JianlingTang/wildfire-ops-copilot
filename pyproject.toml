[project]
name = "wildfire-ops-copilot"
version = "0.1.0"
description = "AI-assisted wildfire operations intelligence MVP backend."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<1",
  "google-adk>=2.0.0,<3",
  "google-auth>=2.47,<3",
  "google-genai>=1.20,<2",
  "httpx>=0.28,<1",
  "matplotlib>=3.9,<4",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pre-commit>=3.8,<4",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.5,<1",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "wildfire_ops_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["frontend", ".venv"]
